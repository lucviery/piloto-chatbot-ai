name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}

services:
  rag-scheduler:
    build:
      context: .
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          sleep "$${RAG_INTERVAL_SECONDS}"
          npm run rag:ingest
        done
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      RAG_BASE_URL: ${RAG_BASE_URL:-https://dokuwiki.megaue.com.br}
      RAG_INTERVAL_SECONDS: ${RAG_INTERVAL_SECONDS:-86400}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-piloto_chatbot}
      PGUSER: ${POSTGRES_USER:-piloto_chatbot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      PGPOOL_MAX: 2
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_INTERNAL_URL: http://api:${API_PORT:-3000}
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_PORT:-3001}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      - 127.0.0.1:${WEB_HOST_PORT:-3001}:${WEB_PORT:-3001}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      API_PORT: ${API_PORT:-3000}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:7b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-180000}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-768}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      RAG_BASE_URL: ${RAG_BASE_URL:-https://dokuwiki.megaue.com.br}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-piloto_chatbot}
      PGUSER: ${POSTGRES_USER:-piloto_chatbot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      PGPOOL_MAX: ${PGPOOL_MAX:-5}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.API_PORT + '/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - 127.0.0.1:${API_HOST_PORT:-3000}:${API_PORT:-3000}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piloto_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-piloto_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.33.1
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - 127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  smoke:
    image: alpine:3.22.1
    command:
      - /bin/sh
      - -ec
      - |
        printf 'piloto-chatbot-ai: ok\n' > /data/status
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nConnection: close\r\n\r\npiloto-chatbot-ai: ok\n' |
            nc -l -p "$${SMOKE_INTERNAL_PORT}"
        done
    environment:
      SMOKE_INTERNAL_PORT: ${SMOKE_INTERNAL_PORT:-8080}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:$${SMOKE_INTERNAL_PORT}/ | grep -q 'piloto-chatbot-ai: ok'"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - smoke-data:/data
    restart: unless-stopped

volumes:
  ollama-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-ollama-data
  smoke-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-smoke-data
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-postgres-data
