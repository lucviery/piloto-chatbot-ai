name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}

services:
  openclaw-init:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2
    profiles: [spike]
    user: 0:0
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 1000:1000 /state/agents /state/workspace"]
    volumes:
      - openclaw-data:/state/agents
      - openclaw-workspace:/state/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH]
    restart: "no"

  openclaw-spike:
    image: ghcr.io/openclaw/openclaw:2026.7.1-2
    profiles: [spike]
    depends_on:
      ollama:
        condition: service_healthy
      openclaw-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_API_KEY: ollama-local
    volumes:
      - ./config/openclaw/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - openclaw-data:/home/node/.openclaw/agents
      - openclaw-workspace:/home/node/.openclaw/workspace
      - ./config/openclaw/workspace/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"

  ollama:
    image: ollama/ollama:0.33.1
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - 127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  smoke:
    image: alpine:3.22.1
    command:
      - /bin/sh
      - -ec
      - |
        printf 'piloto-chatbot-ai: ok\n' > /data/status
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nConnection: close\r\n\r\npiloto-chatbot-ai: ok\n' |
            nc -l -p "$${SMOKE_INTERNAL_PORT}"
        done
    environment:
      SMOKE_INTERNAL_PORT: ${SMOKE_INTERNAL_PORT:-8080}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:$${SMOKE_INTERNAL_PORT}/ | grep -q 'piloto-chatbot-ai: ok'"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - smoke-data:/data
    restart: unless-stopped

volumes:
  openclaw-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-openclaw-data
  openclaw-workspace:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-openclaw-workspace
  ollama-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-ollama-data
  smoke-data:
    name: ${COMPOSE_PROJECT_NAME:-piloto-chatbot-ai}-smoke-data
